name: check

on:
  push:
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      # the tests drive the Chrome that is preinstalled on GitHub's Ubuntu runners; every Yahoo and Sleeper page is mocked
      - run: npm run check
